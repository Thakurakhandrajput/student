<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBC Mess - Weekly Menu</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f6f9">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --primary: #007AFF; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 90px; }

        .header { padding: 30px 20px 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 800; }

        /* Today's Special Card */
        .today-menu-card { margin: 0 20px 25px 20px; background: linear-gradient(135deg, var(--primary), #005bb5); border-radius: 24px; padding: 25px; color: #fff; box-shadow: 0 10px 25px rgba(0,122,255,0.3);}
        .today-menu-card h3 { margin: 0 0 15px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.8); font-weight: 800;}
        .today-menu-card h2 { margin: 0 0 15px 0; font-size: 28px; font-weight: 800;}
        .meal-row-today { display: flex; background: rgba(255,255,255,0.15); padding: 15px; border-radius: 14px; margin-bottom: 10px; align-items: center; border: 1px solid rgba(255,255,255,0.1);}
        .meal-row-today span { font-size: 22px; margin-right: 15px; }
        .meal-row-today p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3;}

        /* Weekly Menu List */
        .weekly-title { padding: 0 25px; font-size: 14px; color: #888; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;}
        .weekly-container { padding: 0 20px; }
        .week-card { background: var(--card-bg); border-radius: 18px; padding: 18px 20px; margin-bottom: 12px; display: flex; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);}
        .day-badge { background: rgba(0,122,255,0.1); color: var(--primary); font-weight: 800; font-size: 12px; padding: 8px 12px; border-radius: 10px; width: 65px; text-align: center; margin-right: 15px; text-transform: uppercase; margin-top: 2px;}
        .week-details p { margin: 0 0 8px 0; font-size: 14px; font-weight: 600; color: var(--text-main); display: flex; align-items: flex-start;}
        .week-details p:last-child { margin: 0; }
        .week-details span { font-size: 16px; margin-right: 8px; opacity: 0.9;}

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 10px 0 25px 0; z-index: 100; align-items: center;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: none;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        .nav-item.center-qr .nav-icon { background: var(--text-main); color: #fff; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; border-radius: 20px; font-size: 26px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transform: translateY(-10px);}
    </style>
</head>
<body>

    <div class="header">
        <h1>Mess Menu</h1>
    </div>

    <!-- Live Data from Admin will inject here -->
    <div class="today-menu-card">
        <h3>🍽️ Today's Special</h3>
        <h2 id="menu-today-day">Loading...</h2>
        <div class="meal-row-today"><span>🌅</span><p id="m-today-b">...</p></div>
        <div class="meal-row-today"><span>☀️</span><p id="m-today-l">...</p></div>
        <div class="meal-row-today"><span>🌙</span><p id="m-today-d">...</p></div>
    </div>

    <div class="weekly-title">Full Week Routine</div>
    <div class="weekly-container" id="weekly-list">
        <p style="text-align:center; color:#888; font-weight:600;">Fetching Live Menu...</p>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div><span>Home</span></a>
        <a href="qr.html" class="nav-item center-qr"><div class="nav-icon">📱</div><span style="margin-top:2px;">Scan QR</span></a>
        <a href="meal.html" class="nav-item active"><div class="nav-icon">🍽️</div><span>Menu</span></a>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const daysList = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    window.onload = () => {
        let code = localStorage.getItem("studentCode");
        if(!code) { window.location.replace("index.html"); } 
        else { fetchLiveMenu(); }
    }

    // Connects to Firebase to get Live Menu updated by Admin
    function fetchLiveMenu() {
        // Assume menu is stored in config > weekly_menu document
        db.collection("config").doc("weekly_menu").onSnapshot((doc) => {
            let menuData = null;
            if(doc.exists) { menuData = doc.data(); }
            
            let todayIndex = new Date().getDay(); // 0-6
            let todayName = daysList[todayIndex];
            let shortDay = todayName.toLowerCase().substring(0,3); // sun, mon, tue...

            // Populate Today's Card
            document.getElementById("menu-today-day").innerText = todayName;
            
            // If data exists, use it, else show default fallback text
            document.getElementById("m-today-b").innerText = menuData ? (menuData[shortDay + "_b"] || "Update Pending") : "Awaiting Admin Update";
            document.getElementById("m-today-l").innerText = menuData ? (menuData[shortDay + "_l"] || "Update Pending") : "Awaiting Admin Update";
            document.getElementById("m-today-d").innerText = menuData ? (menuData[shortDay + "_d"] || "Update Pending") : "Awaiting Admin Update";

            // Build rest of the week
            let listHTML = "";
            daysList.forEach((dayName, index) => {
                if(index === todayIndex) return; // Skip today

                let sDay = dayName.toLowerCase().substring(0,3);
                let mb = menuData ? (menuData[sDay + "_b"] || "--") : "--";
                let ml = menuData ? (menuData[sDay + "_l"] || "--") : "--";
                let md = menuData ? (menuData[sDay + "_d"] || "--") : "--";

                listHTML += `
                <div class="week-card">
                    <div class="day-badge">${sDay}</div>
                    <div class="week-details">
                        <p><span>🌅</span> ${mb}</p>
                        <p><span>☀️</span> ${ml}</p>
                        <p><span>🌙</span> ${md}</p>
                    </div>
                </div>`;
            });
            
            document.getElementById("weekly-list").innerHTML = listHTML;
        });
    }
</script>

<script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
</script>
</body>
</html>
