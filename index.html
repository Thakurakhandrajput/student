<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Student App</title>
    <!-- Plus Jakarta Sans - Premium Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Setup - No Scrolling Allowed */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            /* Light premium background */
            background-color: #f8fafc;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Disables all scrolling */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Abstract soft background blurs for premium feel */
        .blur-blob {
            position: absolute;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.5;
            border-radius: 50%;
        }
        
        .blob-1 {
            top: -10%; left: -10%;
            width: 40vw; height: 40vw;
            background: #93c5fd; /* Soft Blue */
        }
        
        .blob-2 {
            bottom: -15%; right: -10%;
            width: 45vw; height: 45vw;
            background: #c4b5fd; /* Soft Purple */
        }

        /* Center Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            /* Gentle floating animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* App Icon */
        .app-icon {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            font-size: 34px;
            color: #2563eb; /* Primary Blue */
        }

        h1 {
            font-size: 26px;
            color: #0f172a; /* Very dark slate */
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 14px;
        }

        /* Android Button (Vibrant Green) */
        .btn-android {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-android:hover {
            background: #059669;
            transform: scale(1.02);
        }

        /* iOS Button (Subtle Outline) */
        .btn-ios {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-ios:hover {
            background: #e2e8f0;
            color: #0f172a;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Soft Background Gradients -->
    <div class="blur-blob blob-1"></div>
    <div class="blur-blob blob-2"></div>

    <!-- Centered Card (No scrolling needed) -->
    <div class="card">
        <div class="app-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        
        <h1>Student App</h1>
        <p>Access your dashboard instantly. Download the app to get started.</p>

        <!-- Android Download Link -->
        <a href="student.apk" download="student.apk" class="btn btn-android">
            <i class="fa-brands fa-android"></i> Download for Android
        </a>

        <!-- iOS Coming Soon Button -->
        <button class="btn btn-ios" id="ios-btn">
            <i class="fa-brands fa-apple"></i> Download for iOS
        </button>
    </div>

    <!-- Script for iOS 'Coming Soon' Effect -->
    <script>
        document.getElementById('ios-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const btn = this;
            
            // Save original text
            const originalHtml = btn.innerHTML;
            
            // Change to Warning/Coming Soon state
            btn.innerHTML = '<i class="fa-solid fa-clock"></i> Coming Soon...';
            btn.style.background = '#fef3c7'; /* Light yellow */
            btn.style.color = '#d97706';      /* Dark yellow/orange text */
            btn.style.borderColor = '#fde68a';
            
            // Revert after 3 seconds
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.style.background = '';
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 3000);
        });
    </script>

</body>
</html>
