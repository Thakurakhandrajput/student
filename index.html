<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download Student App</title>
    <!-- Plus Jakarta Sans - Premium Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons (Kept for buttons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Strict Reset & Scroll Lock */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden; 
            position: fixed; 
            overscroll-behavior: none; 
            touch-action: pan-x pan-y;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Abstract soft background blurs */
        .blur-blob {
            position: absolute;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.5;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .blob-1 {
            top: -10%; left: -10%;
            width: 40vw; height: 40vw;
            background: #93c5fd; 
        }
        
        .blob-2 {
            bottom: -15%; right: -10%;
            width: 45vw; height: 45vw;
            background: #c4b5fd; 
        }

        /* Center Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border-radius: 28px;
            padding: 35px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            z-index: 10;
            animation: float 6s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Image Logo Setup */
        .app-icon {
            width: 75px;
            height: 75px;
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            overflow: hidden; /* Keeps the image inside the rounded corners */
            padding: 5px; /* Adds a small breathing room inside the white box */
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the logo doesn't stretch or crop */
        }

        h1 {
            font-size: 24px;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Buttons Fix: Centered & Sleeker */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 300px;
            padding: 13px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s ease;
            margin: 0 auto 12px auto;
            -webkit-tap-highlight-color: transparent;
        }

        /* Android Button */
        .btn-android {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.2);
        }

        .btn-android:hover, .btn-android:active {
            background: #059669;
            transform: scale(0.98);
        }

        /* iOS Button */
        .btn-ios {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-ios:hover, .btn-ios:active {
            background: #e2e8f0;
            color: #0f172a;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Soft Background Gradients -->
    <div class="blur-blob blob-1"></div>
    <div class="blur-blob blob-2"></div>

    <!-- Centered Card -->
    <div class="card">
        
        <!-- Updated: Image Logo inserted here -->
        <div class="app-icon">
            <img src="logo.png" alt="Student App Logo">
        </div>
        
        <h1>Student App</h1>
        <p>Access your dashboard instantly. Download the app to get started.</p>

        <!-- Android Download Link -->
        <a href="student.apk" download="student.apk" class="btn btn-android">
            <i class="fa-brands fa-android"></i> Download for Android
        </a>

        <!-- iOS Coming Soon Button -->
        <button class="btn btn-ios" id="ios-btn">
            <i class="fa-brands fa-apple"></i> Download for iOS
        </button>
    </div>

    <!-- Script for iOS 'Coming Soon' Effect -->
    <script>
        document.getElementById('ios-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const btn = this;
            
            if (btn.classList.contains('waiting')) return;
            
            const originalHtml = btn.innerHTML;
            btn.classList.add('waiting');
            
            // Warning/Coming Soon state
            btn.innerHTML = '<i class="fa-solid fa-clock"></i> Coming Soon...';
            btn.style.background = '#fef3c7';
            btn.style.color = '#d97706';
            btn.style.borderColor = '#fde68a';
            
            // Revert after 3 seconds
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.style.background = '';
                btn.style.color = '';
                btn.style.borderColor = '';
                btn.classList.remove('waiting');
            }, 3000);
        });
    </script>

</body>
</html>
