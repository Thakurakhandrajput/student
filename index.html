<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBC Mess - My Dashboard</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007AFF">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --primary: #007AFF; --success: #34C759; --danger: #FF3B30; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 90px; }

        /* Loader & Login */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:9999; display:flex; justify-content:center; align-items:center;}
        .spinner { border: 4px solid rgba(0, 122, 255, 0.2); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #login-screen { display:none; padding: 20px; text-align: center; height: 100vh; flex-direction: column; justify-content: center; align-items: center;}
        .login-card { background: var(--card-bg); padding: 40px 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 350px; }
        .login-input { width: 100%; background: var(--bg-color); border: 2px solid transparent; padding: 18px; border-radius: 16px; font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 20px; outline: none;}
        .login-input:focus { border-color: var(--primary); background: #fff; }
        .btn-main { width: 100%; background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;}

        /* Header */
        .header { padding: 30px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 800; }
        .btn-logout { background: rgba(255,59,48,0.1); color: var(--danger); border: none; padding: 8px 15px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; }

        /* Main Content */
        #app-screen { display: none; padding: 0 20px;}
        
        .profile-card { background: linear-gradient(135deg, #1c1c1e, #2c2c2e); border-radius: 24px; padding: 25px; color: #fff; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);}
        .profile-img { width: 90px; height: 90px; border-radius: 25px; border: 3px solid rgba(255,255,255,0.2); margin-bottom: 10px; object-fit: cover; }
        .profile-card h2 { margin: 0; font-size: 22px; font-weight: 800; }
        .profile-card p { margin: 5px 0 0 0; font-size: 13px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        
        .validity-card { background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px;}
        .validity-card h3 { margin: 0; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px;}
        .days-big { font-size: 42px; font-weight: 800; margin: 5px 0; color: var(--success); }
        .days-big.red { color: var(--danger); }
        .valid-date { font-size: 13px; font-weight: 700; background: var(--bg-color); display: inline-block; padding: 6px 15px; border-radius: 12px;}

        /* Live Attendance Section */
        .attendance-card { background: var(--card-bg); border-radius: 20px; padding: 20px; }
        .attendance-card h3 { margin: 0 0 15px 0; font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; justify-content: space-between;}
        .att-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #f9f9f9; border-radius: 12px; margin-bottom: 10px; font-weight: 600; border: 1px solid #f0f0f0;}
        .status { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 800;}
        .st-done { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .st-pend { background: rgba(142, 142, 147, 0.15); color: #888; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 10px 0 25px 0; z-index: 100; align-items: center;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: none;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        .nav-item.center-qr .nav-icon { background: var(--text-main); color: #fff; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; border-radius: 20px; font-size: 26px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transform: translateY(-10px);}
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="color:var(--primary); margin:0 0 5px 0;">Student Portal</h1>
            <p style="color:#888; font-weight:600; margin:0 0 25px 0; font-size:14px;">Enter your Mess ID Code</p>
            <input type="text" id="login-code" class="login-input" placeholder="101" autocomplete="off">
            <button class="btn-main" id="btn-login" onclick="verifyLogin()">Login Securely</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="header">
            <h1>My Dashboard</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="profile-card">
            <img id="h-photo" src="" class="profile-img">
            <h2 id="h-name">Loading...</h2>
            <p id="h-details">Room: -- | Code: --</p>
        </div>
        
        <div class="validity-card">
            <h3>Mess Validity Left</h3>
            <div id="h-days" class="days-big">0</div>
            <div class="valid-date" id="h-date">Valid Till: --</div>
        </div>

        <!-- LIVE ATTENDANCE -->
        <div class="attendance-card">
            <h3>Today's Activity <span style="color:var(--primary); font-size:12px;" id="today-date-text"></span></h3>
            <div class="att-row"><span>🌅 Breakfast</span> <span id="att-b" class="status st-pend">Pending</span></div>
            <div class="att-row"><span>☀️ Lunch</span> <span id="att-l" class="status st-pend">Pending</span></div>
            <div class="att-row"><span>🌙 Dinner</span> <span id="att-d" class="status st-pend">Pending</span></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><div class="nav-icon">🏠</div><span>Home</span></a>
        <a href="qr.html" class="nav-item center-qr"><div class="nav-icon">📱</div><span style="margin-top:2px;">Scan QR</span></a>
        <a href="meal.html" class="nav-item"><div class="nav-icon">🍽️</div><span>Menu</span></a>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = () => {
        document.getElementById('today-date-text').innerText = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
        let code = localStorage.getItem("studentCode");
        if(code) { fetchStudentData(code); } 
        else { 
            document.getElementById("loader").style.display = "none";
            document.getElementById("login-screen").style.display = "flex"; 
        }
    }

    async function verifyLogin() {
        let code = document.getElementById("login-code").value.trim();
        if(!code) return alert("Please enter your code");
        let btn = document.getElementById("btn-login"); btn.innerText = "⏳ Checking..."; btn.disabled = true;
        try {
            let doc = await db.collection("students").doc(code).get();
            if(doc.exists) { localStorage.setItem("studentCode", code); fetchStudentData(code); } 
            else { alert("❌ Invalid Code!"); btn.innerText = "Login Securely"; btn.disabled = false; }
        } catch(e) { alert("Error: " + e.message); btn.innerText = "Login Securely"; btn.disabled = false; }
    }

    function logout() { if(confirm("Log out?")) { localStorage.removeItem("studentCode"); window.location.reload(); } }

    function fetchStudentData(code) {
        document.getElementById("login-screen").style.display = "none"; document.getElementById("loader").style.display = "flex";
        
        // 1. Get Details
        db.collection("students").doc(code).onSnapshot((doc) => {
            if(!doc.exists) { logout(); return; }
            let stu = doc.data();
            document.getElementById("h-photo").src = stu.photo; document.getElementById("h-name").innerText = stu.name;
            document.getElementById("h-details").innerText = `Room: ${stu.room} | Code: ${stu.code}`;
            
            let today = new Date(); today.setHours(0,0,0,0); let target = new Date(stu.feeValidTill);
            let daysLeft = Math.ceil((target - target.getTimezoneOffset()*60000 - today) / (1000 * 60 * 60 * 24));
            
            let daysEl = document.getElementById("h-days");
            if(stu.status === 'paused') { daysEl.innerText = "PAUSED"; daysEl.className = "days-big"; } 
            else if(daysLeft < 0) { daysEl.innerText = "EXPIRED"; daysEl.className = "days-big red"; } 
            else { daysEl.innerText = daysLeft + " Days"; daysEl.className = "days-big"; }
            
            document.getElementById("h-date").innerText = `Valid Till: ${new Date(stu.feeValidTill).toLocaleDateString('en-US', {day: 'numeric', month: 'short', year:'numeric'})}`;
            
            document.getElementById("loader").style.display = "none"; document.getElementById("app-screen").style.display = "block";
        });

        // 2. Get Live Attendance
        let todayStr = new Date().toISOString().split('T')[0];
        db.collection("attendance").where("code", "==", code).where("date", "==", todayStr).onSnapshot((snap) => {
            // Reset to pending first
            document.getElementById("att-b").className = "status st-pend"; document.getElementById("att-b").innerText = "Pending";
            document.getElementById("att-l").className = "status st-pend"; document.getElementById("att-l").innerText = "Pending";
            document.getElementById("att-d").className = "status st-pend"; document.getElementById("att-d").innerText = "Pending";
            
            snap.forEach(doc => {
                let m = doc.data().meal.toLowerCase();
                let el = document.getElementById("att-" + m.charAt(0));
                if(el) { el.className = "status st-done"; el.innerText = "✔ Eaten"; }
            });
        });
    }
</script>

<!-- SERVICE WORKER REGISTRATION FOR APP INSTALL -->
<script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
</script>
</body>
</html>
