<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Student App</title>
    <!-- Google Fonts for Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Premium Dark Gradient Background */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .circle-1, .circle-2 {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            filter: blur(80px);
            z-index: -1;
        }
        .circle-1 { width: 300px; height: 300px; top: -100px; left: -100px; opacity: 0.5; }
        .circle-2 { width: 400px; height: 400px; bottom: -150px; right: -100px; background: linear-gradient(135deg, #43e97b, #38f9d7); opacity: 0.4; }

        /* Glassmorphism Card */
        .download-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .download-card:hover {
            transform: translateY(-5px);
        }

        /* App Icon */
        .app-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            border-radius: 22px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(67, 233, 123, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #b0b0c0;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* Buttons Setup */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            border: none;
            cursor: pointer;
        }

        /* Android Button */
        .btn-android {
            background: linear-gradient(135deg, #00C853, #64DD17);
            color: #fff;
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
        }

        .btn-android:hover {
            box-shadow: 0 12px 25px rgba(0, 200, 83, 0.5);
            transform: translateY(-2px);
        }

        /* iOS Button */
        .btn-ios {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-ios:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-ios i {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Background glowing circles -->
    <div class="circle-1"></div>
    <div class="circle-2"></div>

    <div class="download-card">
        <div class="app-icon">
            <i class="fas fa-user-graduate"></i>
        </div>
        <h1>Student App</h1>
        <p>Your complete academic companion. Download the app to access all premium features on the go.</p>

        <!-- Android Download Button -->
        <a href="student.apk" download="student.apk" class="btn btn-android">
            <i class="fab fa-android"></i> Download for Android
        </a>

        <!-- iOS Coming Soon Button -->
        <button id="iosBtn" class="btn btn-ios">
            <i class="fab fa-apple"></i> Download for iOS
        </button>
    </div>

    <!-- JavaScript for iOS Button Interaction -->
    <script>
        document.getElementById('iosBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // Change text and style to show "Coming Soon"
            btn.innerHTML = '<i class="fas fa-hourglass-half"></i> Coming Soon...';
            btn.style.color = '#ffb142';
            btn.style.borderColor = '#ffb142';
            btn.style.background = 'rgba(255, 177, 66, 0.1)';

            // Revert back to original state after 3 seconds
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.color = '#fff';
                btn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                btn.style.background = 'rgba(255, 255, 255, 0.05)';
            }, 3000);
        });
    </script>
</body>
</html>
